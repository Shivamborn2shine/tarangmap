services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tarang
      POSTGRES_PASSWORD: tarang_local_dev
      POSTGRES_DB: tarang
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../services/api
    environment:
      DATABASE_URL: postgresql+psycopg://tarang:tarang_local_dev@db:5432/tarang
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
