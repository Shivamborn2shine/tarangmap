<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <rect width="1000" height="640" fill="#F7FAFC"/>
  <!-- Outer walls -->
  <rect x="40" y="40" width="920" height="560" rx="8" fill="#FFFFFF" stroke="#102A43" stroke-width="4"/>

  <!-- Living Room (Top Left) -->
  <rect x="40" y="40" width="440" height="320" fill="#F8FAFC" stroke="#334E68" stroke-width="2"/>
  <text x="70" y="82" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#102A43">Living Room</text>
  <text x="70" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#627D98">Router Alcove • Sofa • TV</text>
  <!-- Sofa & Router icon -->
  <rect x="70" y="150" width="140" height="50" rx="6" fill="#E6EEF5" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="140" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#486581">Sofa</text>
  <circle cx="420" cy="95" r="14" fill="#E6F6F7" stroke="#087F8C" stroke-width="2"/>
  <text x="420" y="128" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#087F8C">Router</text>

  <!-- Kitchen & Dining (Bottom Left) -->
  <rect x="40" y="360" width="320" height="240" fill="#FFFFFF" stroke="#334E68" stroke-width="2"/>
  <text x="70" y="400" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#102A43">Kitchen &amp; Dining</text>
  <rect x="70" y="480" width="180" height="80" rx="4" fill="#F0F4F8" stroke="#BCCCDC" stroke-width="1.5"/>
  <text x="160" y="525" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#486581">Counter &amp; Appliances</text>

  <!-- Hallway (Center) -->
  <rect x="360" y="360" width="220" height="240" fill="#F7FAFC" stroke="#334E68" stroke-width="2"/>
  <text x="470" y="480" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#486581">Hallway</text>

  <!-- Study / Home Office (Top Center-Right) -->
  <rect x="480" y="40" width="240" height="320" fill="#FFFFFF" stroke="#334E68" stroke-width="2"/>
  <text x="510" y="82" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#102A43">Study</text>
  <rect x="520" y="120" width="120" height="56" rx="4" fill="#F0F4F8" stroke="#BCCCDC" stroke-width="1.5"/>
  <text x="580" y="153" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#486581">Desk</text>

  <!-- Master Bedroom (Top Right) -->
  <rect x="720" y="40" width="240" height="320" fill="#F8FAFC" stroke="#334E68" stroke-width="2"/>
  <text x="750" y="82" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#102A43">Master Bedroom</text>
  <rect x="770" y="140" width="140" height="110" rx="6" fill="#E6EEF5" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="840" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#486581">Bed</text>

  <!-- Balcony (Bottom Right) -->
  <rect x="580" y="360" width="380" height="240" fill="#F0F7F4" stroke="#334E68" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="615" y="400" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#102A43">Balcony</text>
  <text x="615" y="424" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#627D98">Outer Concrete Wall • Weak Wi-Fi Zone</text>

  <!-- Doorway gaps -->
  <line x1="480" y1="260" x2="480" y2="320" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="720" y1="260" x2="720" y2="320" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="360" y1="430" x2="360" y2="500" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="580" y1="430" x2="580" y2="500" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="410" y1="360" x2="470" y2="360" stroke="#FFFFFF" stroke-width="6"/>
</svg>
